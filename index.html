<style>
  :root{
    --bg: #F3EDE3;
    --surface: #FBF8F1;
    --surface-2: #ECE3D0;
    --border: #DED0B4;
    --olive: #5C6B45;
    --olive-deep: #46512F;
    --sage: #8FA37E;
    --sage-soft: #E4E9DB;
    --terracotta: #B5674A;
    --ink: #3A3618;
    --text: #3A3618;
    --text-muted: #8C8468;
    --text-faint: #AFA688;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--text);
    font-family: 'Sarabun', sans-serif;
    min-height: 100vh;
    padding-bottom: 84px;
  }
  h1,h2,h3,.display{ font-family:'Trirong', serif; letter-spacing:.2px; font-weight:600; }
  .app{ max-width: 480px; margin: 0 auto; min-height:100vh; position:relative; }

  /* header */
  .topbar{
    padding: 22px 18px 14px;
    position: sticky; top:0; z-index:5;
    background: linear-gradient(180deg, var(--bg) 70%, transparent);
  }
  .topbar .eyebrow{
    font-size:11px; letter-spacing:2px; color: var(--olive);
    text-transform:uppercase; font-weight:600; display:flex; align-items:center; gap:8px;
  }
  .topbar .eyebrow::before{ content:''; width:18px; height:1px; background:var(--olive); display:inline-block; }
  .topbar h1{ font-size:24px; margin:6px 0 0; font-weight:600; }

  .content{ padding: 4px 18px 24px; }

  /* thin divider, echoing the underline beneath the logo wordmark */
  .road-divider{
    height:1px; margin: 14px 0 18px;
    background: repeating-linear-gradient(90deg, var(--olive) 0 5px, transparent 5px 10px);
    opacity:.55;
  }

  /* bottom nav */
  .bottomnav{
    position:fixed; bottom:0; left:0; right:0; z-index:20;
    background: var(--surface); border-top:1px solid var(--border);
  }
  .bottomnav-inner{
    max-width:480px; margin:0 auto; display:flex;
  }
  .navbtn{
    flex:1; background:none; border:none; color: var(--text-faint);
    font-family:'Trirong',serif; font-size:12px; font-weight:600;
    padding: 10px 4px 12px; display:flex; flex-direction:column; align-items:center; gap:4px;
    cursor:pointer;
  }
  .navbtn .ic{ font-size:19px; }
  .navbtn.active{ color: var(--olive); }
  .navbtn.active .ic{ transform: translateY(-2px); }

  /* cards */
  .card{
    background: var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:16px; margin-bottom:12px; box-shadow: 0 1px 3px rgba(90,80,50,.06);
  }
  .card-tap{ cursor:pointer; }
  .card-tap:active{ background: var(--surface-2); }
  .row{ display:flex; align-items:center; justify-content:space-between; gap:10px; }
  .muted{ color: var(--text-muted); font-size:13px; }
  .faint{ color: var(--text-faint); font-size:12px; }

  .tag{
    display:inline-block; font-size:11px; font-weight:600; padding:3px 9px;
    border-radius:100px; font-family:'Trirong',serif; letter-spacing:.3px;
  }
  .tag-planning{ background: rgba(92,107,69,.14); color: var(--olive); }
  .tag-ongoing{ background: rgba(143,163,126,.28); color: var(--olive-deep); }
  .tag-done{ background: rgba(140,132,104,.15); color: var(--text-muted); }

  /* buttons */
  .btn{
    font-family:'Trirong',serif; font-weight:600; font-size:14px;
    border-radius:10px; border:none; padding:12px 16px; cursor:pointer;
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-primary{ background: var(--olive); color:#FBF8F1; }
  .btn-primary:active{ background: var(--olive-deep); }
  .btn-ghost{ background: var(--surface-2); color: var(--text); border:1px solid var(--border); }
  .btn-full{ width:100%; }
  .btn-danger{ background: rgba(181,103,74,.14); color: var(--terracotta); }
  .btn-sm{ padding:8px 12px; font-size:13px; }
  .fab{
    position:fixed; right: calc(50% - 240px + 18px); bottom: 96px; z-index:15;
    width:52px; height:52px; border-radius:50%; background: var(--olive); color:#FBF8F1;
    border:none; font-size:26px; box-shadow: 0 8px 20px rgba(92,107,69,.35); cursor:pointer;
  }
  @media (max-width: 520px){ .fab{ right:18px; } }

  .help-fab{
    position:fixed; top:16px; right: calc(50% - 240px + 16px); z-index:16;
    width:32px; height:32px; border-radius:50%;
    background: var(--surface); border:1px solid var(--border); color: var(--olive);
    font-family:'Trirong',serif; font-weight:700; font-size:14px; cursor:pointer;
  }
  @media (max-width: 520px){ .help-fab{ right:16px; } }

  /* forms */
  label{ display:block; font-size:12px; color: var(--text-muted); margin: 12px 0 6px; font-weight:600; }
  input, textarea, select{
    width:100%; background: var(--surface-2); border:1px solid var(--border); color:var(--text);
    border-radius:10px; padding:11px 12px; font-family:'Sarabun',sans-serif; font-size:14px;
  }
  input:focus, textarea:focus, select:focus{ outline:2px solid var(--olive); outline-offset:1px; }
  textarea{ resize:vertical; min-height:70px; }
  .field-row{ display:flex; gap:10px; }
  .field-row > div{ flex:1; }
  .chip-select{ display:flex; flex-wrap:wrap; gap:8px; margin-top:6px; }
  .chip{
    padding:8px 13px; border-radius:100px; background: var(--surface-2); border:1px solid var(--border);
    font-size:13px; cursor:pointer; color: var(--text-muted);
  }
  .chip.on{ background: rgba(92,107,69,.16); border-color: var(--olive); color: var(--olive); font-weight:600; }

  /* modal / sheet */
  .overlay{
    position:fixed; inset:0; background: rgba(58,54,24,.35); z-index:30;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .sheet{
    background: var(--bg); width:100%; max-width:480px; max-height:88vh; overflow-y:auto;
    border-radius:20px 20px 0 0; padding: 18px 18px 28px; border-top:1px solid var(--border);
  }
  .sheet-handle{ width:36px; height:4px; background:var(--border); border-radius:3px; margin: 0 auto 14px; }
  .sheet-close{
    position:absolute; top:14px; right:16px; background:none; border:none; color:var(--text-muted);
    font-size:20px; cursor:pointer;
  }

  /* stats */
  .stat-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .stat-box{ background: var(--surface); border:1px solid var(--border); border-radius:12px; padding:14px 8px; text-align:center; }
  .stat-num{ font-family:'Trirong',serif; font-size:22px; font-weight:700; color: var(--olive); font-variant-numeric:tabular-nums; }
  .stat-label{ font-size:11px; color: var(--text-muted); margin-top:2px; }

  /* thailand svg map */
  .map-wrap{
    background: var(--surface); border:1px solid var(--border); border-radius:16px;
    padding: 14px 10px 6px; margin-bottom:16px; text-align:center;
  }
  .map-wrap svg{ width:100%; max-width:280px; height:auto; }
  .map-path{
    fill: var(--surface-2); stroke: var(--border); stroke-width:0.6; cursor:pointer;
    transition: fill .15s;
  }
  .map-path.v1{ fill: rgba(143,163,126,.45); }
  .map-path.v2{ fill: rgba(143,163,126,.75); }
  .map-path.v3{ fill: var(--sage); }
  .map-path:active{ fill: var(--olive); }

  /* province plate grid */
  .region-block{ margin-bottom:18px; }
  .region-title{ font-size:13px; font-weight:600; color: var(--text-muted); margin-bottom:8px; font-family:'Trirong',serif; }
  .plate-grid{ display:flex; flex-wrap:wrap; gap:7px; }
  .plate{
    font-family:'Trirong',serif; font-weight:600; font-size:11.5px;
    background: var(--surface-2); color: var(--text-faint); border:1.5px solid var(--border);
    border-radius:100px; padding:7px 11px; cursor:pointer; line-height:1.2; text-align:center;
    min-width:58px;
  }
  .plate .cnt{ display:block; font-size:9px; opacity:.75; margin-top:2px; font-weight:500;}
  .plate.v1{ background: rgba(143,163,126,.22); border-color: rgba(143,163,126,.55); color: var(--olive-deep); }
  .plate.v2{ background: rgba(143,163,126,.4); border-color: var(--sage); color: var(--olive-deep); }
  .plate.v3{ background: var(--sage); border-color: var(--sage); color:#FBF8F1; }

  /* budget bar */
  .bar-track{ height:9px; border-radius:6px; background: var(--surface-2); overflow:hidden; margin-top:8px; }
  .bar-fill{ height:100%; border-radius:6px; background: var(--sage); transition: width .3s; }
  .bar-fill.over{ background: var(--terracotta); }

  /* checkpoint item */
  .cp-item{ border-top:1px solid var(--border); padding:12px 0; }
  .cp-item:first-child{ border-top:none; padding-top:0; }
  .leg-row{ padding: 2px 0 2px 17px; }
  .leg-row .leg-body{
    background: rgba(92,107,69,.06); border:1px dashed var(--border); border-radius:10px;
    padding:9px 11px; margin: 2px 0;
  }  .cp-head{ display:flex; align-items:center; gap:8px; }
  .cp-dot{ width:9px; height:9px; border-radius:50%; background: var(--border); flex-shrink:0; }
  .cp-dot.visited{ background: var(--sage); }
  .cp-title{ font-weight:600; font-size:14.5px; flex:1; }
  .mood-badge{ font-size:16px; }

  .empty-state{ text-align:center; padding: 34px 16px; color: var(--text-muted); }
  .empty-state .big{ font-size:34px; margin-bottom:8px; }
  .empty-state .title{ font-family:'Trirong',serif; color:var(--text); font-weight:600; font-size:15px; margin-bottom:4px;}

  .back-row{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .back-btn{ background:none; border:none; color: var(--text-muted); font-size:20px; cursor:pointer; padding:4px; }

  .subtabs{ display:flex; gap:6px; margin: 14px 0 4px; background: var(--surface); padding:4px; border-radius:11px; border:1px solid var(--border); }
  .subtab{ flex:1; text-align:center; padding:8px 4px; border-radius:8px; font-size:12.5px; font-weight:600; font-family:'Trirong',serif; color: var(--text-muted); cursor:pointer; }
  .subtab.on{ background: var(--surface-2); color: var(--olive); }

  .loading-wrap{ display:flex; align-items:center; justify-content:center; min-height:100vh; color:var(--text-muted); font-family:'Trirong',serif; }

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%); z-index:50;
    max-width:440px; width:calc(100% - 32px);
    background: var(--surface); border:1px solid var(--terracotta); border-radius:12px;
    padding:12px 14px; display:flex; align-items:center; gap:10px; box-shadow:0 8px 24px rgba(90,80,50,.18);
  }
  .toast .msg{ flex:1; font-size:13px; color: var(--text); }
  .toast button{ flex-shrink:0; }

  .confirm-overlay{ z-index:60; }
  .confirm-box{
    background: var(--bg); width:100%; max-width:420px; border-radius:16px; padding:20px;
    border:1px solid var(--border); margin: 0 16px 16px;
  }

</style>

// Free, keyless geocoding + routing (OpenStreetMap Nominatim + OSRM public demo server).
// NOTE: these only work when this file is opened OUTSIDE Claude's sandbox
// (e.g. via GitHub Pages), since Claude artifacts block external fetch() calls.
async function geocodePlace(query){
  try{
    const url = 'https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=th&q=' + encodeURIComponent(query);
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    if(!data || !data[0]) return null;
    return { lat: parseFloat(data[0].lat), lon: parseFloat(data[0].lon) };
  }catch(e){ return null; }
}
async function calcOSRMRoute(a, b){
  try{
    const url = `https://router.project-osrm.org/route/v1/driving/${a.lon},${a.lat};${b.lon},${b.lat}?overview=false`;
    const res = await fetch(url);
    if(!res.ok) return null;
    const data = await res.json();
    if(data.code !== 'Ok' || !data.routes || !data.routes[0]) return null;
    return { distanceKm: data.routes[0].distance/1000, durationMin: data.routes[0].duration/60 };
  }catch(e){ return null; }
}
// Geocodes a checkpoint once and caches lat/lon on it, so repeated lookups
// (leg distance calc, route map) don't re-hit Nominatim for the same place.
async function geocodeCheckpoint(c){
  if(c.lat!=null && c.lon!=null) return {lat:c.lat, lon:c.lon};
  const geo = await geocodePlace(`${c.name}, ${c.province}, Thailand`) || await geocodePlace(`${c.province}, Thailand`);
  if(!geo) return null;
  c.lat = geo.lat; c.lon = geo.lon;
  await sleep(1100); // respect Nominatim's 1 req/sec usage policy
  return geo;
}

const STORAGE_KEY = 'roadtrip-data-v1';
const hasCloudStorage = (typeof window !== 'undefined') && !!window.storage;

async function storageGet(key){
  if(hasCloudStorage) return await window.storage.get(key);
  const raw = localStorage.getItem(key);
  return raw!=null ? {key, value: raw} : null;
}
async function storageSet(key, value){
  if(hasCloudStorage) return await window.storage.set(key, value);
  localStorage.setItem(key, value);
  return {key, value};
}

async function loadData(){
  try{
    const r = await storageGet(STORAGE_KEY);
    if(r && r.value){ const p = JSON.parse(r.value); state.trips = p.trips||[]; }
  }catch(e){ /* no data yet */ }
}
let saveInFlight = false;
let saveDirty = false;
let saveDebounceTimer = null;

async function doSave(retrying){
  try{
    await storageSet(STORAGE_KEY, JSON.stringify({trips: state.trips}));
    if(state.toast){ state.toast = null; render(); }
  }catch(e){
    console.error('save failed', e);
    if(!retrying){
      await sleep(700);
      return doSave(true);
    }
    state.toast = 'บันทึกไม่สำเร็จ ระบบเก็บข้อมูลขัดข้องชั่วคราว';
    state.toastMode = 'save-error';
    render();
    return;
  }
  if(saveDirty){
    saveDirty = false;
    return doSave();
  }
}
async function triggerSaveNow(){
  if(saveInFlight){ saveDirty = true; return; }
  saveInFlight = true;
  await doSave();
  saveInFlight = false;
}
// scheduleSave: debounces rapid edits (e.g. many fields changed in quick succession)
// into a single save that always reads the CURRENT in-memory state at send time,
// avoiding out-of-order network responses overwriting newer data.
function scheduleSave(){
  if(saveDebounceTimer) clearTimeout(saveDebounceTimer);
  saveDebounceTimer = setTimeout(()=>{ saveDebounceTimer = null; triggerSaveNow(); }, 400);
}
async function retrySave(){
  state.toast = null; render();
  await triggerSaveNow();
}

function findTrip(id){ return state.trips.find(t=>t.id===id); }
function activeTrips(){ return state.trips.filter(t=>!t.deleted); }

function provinceStats(){
  const map = {};
  ALL_PROVINCES.forEach(p=> map[p] = {count:0, visits:[]});
  activeTrips().forEach(t=>{
    if(t.status === 'planning') return; // ทริปที่ยังวางแผนอยู่ ยังไม่นับว่าไปจริงบนแผนที่
    (t.checkpoints||[]).forEach(c=>{
      if(c.visited && c.province && map[c.province]){
        map[c.province].count++;
        map[c.province].visits.push({trip:t.name, date:c.date, name:c.name, mood:c.mood});
      }
    });
  });
  return map;
}
function dominantMood(checkpoints){
  const counts = {};
  (checkpoints||[]).forEach(c=>{ if(c.visited && c.mood) counts[c.mood] = (counts[c.mood]||0)+1; });
  let best=null, bestN=0;
  Object.entries(counts).forEach(([m,n])=>{ if(n>bestN){ best=m; bestN=n; } });
  return best;
}

/* ---------- Trip detail ---------- */
function renderTripDetail(){
  const t = findTrip(state.activeTripId);
  if(!t){ state.activeTripId=null; return renderTripsList(); }
  const spent = (t.expenses||[]).reduce((s,e)=>s+Number(e.amount||0),0);
  const pct = t.budget>0 ? Math.min(100, Math.round(spent/t.budget*100)) : 0;
  const over = t.budget>0 && spent > t.budget;
  const dist = (t.vehicle && t.vehicle.startOdo!=null && t.vehicle.endOdo!=null && t.vehicle.endOdo>=t.vehicle.startOdo) ? (t.vehicle.endOdo - t.vehicle.startOdo) : null;

  let sub = '';
  if(state.tripSubtab==='stops') sub = renderStopsSub(t);
  else if(state.tripSubtab==='vehicle') sub = renderVehicleSub(t, dist);
  else if(state.tripSubtab==='budget') sub = renderBudgetSub(t, spent, pct, over);

  return `
    <div class="topbar" style="padding-left:0;padding-right:0;">

function renderRouteMap(t, cps){
  if(cps.length<2) return '';
  const currentIds = cps.map(c=>c.id);
  const savedIds = t.routeStopIds || [];
  const idsMatch = currentIds.length===savedIds.length && currentIds.every((id,i)=>id===savedIds[i]);
  const allGeocoded = cps.every(c=>c.lat!=null && c.lon!=null);
  const ready = idsMatch && allGeocoded;
  const loading = state.routeMapLoading === t.id;
  const errored = state.routeMapError === t.id;

  if(!ready){
    return `
      <div class="card">
        <div style="font-weight:700;margin-bottom:6px;">🧭 แผนที่เส้นทาง</div>
        <div class="faint" style="margin-bottom:10px;">ลากเส้นตรงเชื่อมจุดแวะทั้งหมดของทริปนี้บนแผนที่ (ไม่อิงถนนจริง) ฟรี ไม่ต้องมี API key — <b style="color:var(--text);">ใช้ได้เฉพาะตอนเปิดแอปนอกแชท Claude</b> เช่นผ่านลิงก์ GitHub Pages</div>
        <button class="btn btn-primary btn-full" onclick="app.calcTripRoute('${t.id}')" ${loading?'disabled':''}>${loading? '⏳ กำลังคำนวณ...' : '🧭 วาดเส้นทาง'}</button>
        ${errored? `<div class="faint" style="color:var(--terracotta);margin-top:8px;">คำนวณไม่สำเร็จ ลองใหม่อีกครั้ง หรือเช็คอินเทอร์เน็ต</div>`:''}
      </div>
    `;
  }

  const pts = cps.map(c=>({ ...projectLonLat(c.lon, c.lat), name:c.name }));
  const xs = pts.map(p=>p.x), ys = pts.map(p=>p.y);
  const pad = 22;
  let minX = Math.min(...xs)-pad, maxX = Math.max(...xs)+pad;
  let minY = Math.min(...ys)-pad, maxY = Math.max(...ys)+pad;
  if(maxX-minX < 60){ const c=(minX+maxX)/2; minX=c-30; maxX=c+30; }
  if(maxY-minY < 60){ const c=(minY+maxY)/2; minY=c-30; maxY=c+30; }
  const vw = maxX-minX, vh = maxY-minY;
  const routeD = "M" + pts.map(p=>`${p.x.toFixed(1)},${p.y.toFixed(1)}`).join(" L");
  const routeProvinces = new Set(cps.map(c=>c.province));

  return `
    <div class="card">
      <div class="row">
        <div style="font-weight:700;">🧭 แผนที่เส้นทาง</div>
        <button class="btn btn-ghost btn-sm" onclick="app.calcTripRoute('${t.id}')" ${loading?'disabled':''}>${loading?'⏳':'🔄 คำนวณใหม่'}</button>
      </div>
      <div style="background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px;margin-top:8px;">
        <svg viewBox="${minX.toFixed(1)} ${minY.toFixed(1)} ${vw.toFixed(1)} ${vh.toFixed(1)}" style="width:100%;display:block;">
          ${PROVINCE_PATHS.map(p=>`<path class="map-path ${routeProvinces.has(p.th)?'v1':''}" d="${p.d}"></path>`).join('')}
          <path d="${routeD}" fill="none" stroke="var(--olive)" stroke-width="1.6" stroke-dasharray="4 3" stroke-linecap="round"></path>
          ${pts.map((p,i)=>`
            <circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="6" fill="var(--olive)" stroke="var(--surface)" stroke-width="1.3"></circle>
            <text x="${p.x.toFixed(1)}" y="${p.y.toFixed(1)}" text-anchor="middle" dominant-baseline="central" font-size="6" font-weight="700" fill="var(--surface)">${i+1}</text>
          `).join('')}
        </svg>
      </div>
      <div class="faint" style="margin-top:6px;">เส้นตรงระหว่างจุด ไม่อิงถนนจริง</div>
    </div>
  `;
}

function renderStopsSub(t){
  const cps = [...(t.checkpoints||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  let estTotalKm = 0, estTotalMin = 0, estCount = 0;
  cps.forEach((c,i)=>{
    if(i>0 && c.legFromId===cps[i-1].id && c.legDistanceKm!=null){
      estTotalKm += c.legDistanceKm; estTotalMin += c.legDurationMin; estCount++;
    }
  });
  return `
    ${renderRouteMap(t, cps)}
    <div class="card">
      ${cps.length===0 ? `
        <div class="empty-state" style="padding:18px 8px;">
          <div class="big">📍</div>
          <div class="title">ยังไม่มีจุดแวะ</div>
          <div>เพิ่มสถานที่ที่วางแผนจะไป แล้วกลับมาบันทึกความทรงจำทีหลังได้</div>
        </div>` : cps.map((c,i)=>`
        ${i>0 ? renderLegRow(t, cps[i-1], c) : ''}
        <div class="cp-item">
          <div class="cp-head">
            <span class="cp-dot ${c.visited?'visited':''}"></span>
            <span class="cp-title">${esc(c.name)}</span>
          </div>
          <div class="faint" style="margin:4px 0 8px 17px;">${esc(c.province)} · ${fmtDate(c.date)}</div>

          <div style="margin-left:17px;">
            <div class="chip-select" style="margin-bottom:8px;">
              <div class="chip ${!c.visited?'on':''}" onclick="app.setVisited('${t.id}','${c.id}',false)">วางแผนไว้</div>
              <div class="chip ${c.visited?'on':''}" onclick="app.setVisited('${t.id}','${c.id}',true)">ไปแล้ว</div>
            </div>

            ${c.visited ? `
              <div class="faint" style="margin-bottom:5px;">ความรู้สึก</div>
              <div class="chip-select" style="margin-bottom:8px;">
                ${MOODS.map(m=>`<div class="chip ${c.mood===m.v?'on':''}" onclick="app.setMood('${t.id}','${c.id}','${m.v}')">${m.e} ${m.v}</div>`).join('')}
              </div>
            ` : ''}

            <textarea placeholder="บันทึกความทรงจำ... ไปแล้วรู้สึกยังไง เจออะไรน่าจดจำบ้าง" onchange="app.updateCheckpointNote('${t.id}','${c.id}',this.value)">${esc(c.note||'')}</textarea>

            <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
              <button class="btn btn-ghost btn-sm" onclick="app.openSheet('new-expense','${t.id}','${encodeURIComponent(c.name)}')">💰 ค่าใช้จ่าย</button>
              <button class="btn btn-ghost btn-sm" onclick="app.openSheet('edit-cp','${t.id}','${c.id}')">แก้ไขชื่อ/จังหวัด/วันที่</button>
              <button class="btn btn-ghost btn-sm" onclick="app.deleteCheckpoint('${t.id}','${c.id}')">ลบ</button>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
    ${estCount>0 ? `
      <div class="card" style="background:rgba(92,107,69,.06);border-color:rgba(92,107,69,.35);">
        <div class="row"><div class="muted">🧭 ระยะทางรวมที่ประเมินไว้ (${estCount}/${cps.length-1} ช่วง)</div><div style="font-weight:700;">${money(Math.round(estTotalKm))} กม.</div></div>
        <div class="row" style="margin-top:4px;"><div class="muted">เวลาขับรวมโดยประมาณ</div><div style="font-weight:700;">${Math.floor(estTotalMin/60)} ชม. ${Math.round(estTotalMin%60)} นาที</div></div>
        <div class="faint" style="margin-top:6px;">*เป็นตัวเลขวางแผนล่วงหน้า ไม่ใช่ระยะทางจริงที่ขับ (ดูของจริงได้ที่แท็บ "ระยะทาง" หลังเดินทาง)</div>
      </div>
    ` : ''}
    <button class="btn btn-primary btn-full" onclick="app.openSheet('new-cp','${t.id}')">+ เพิ่มจุดแวะ</button>
  `;
}

function renderLegRow(t, prev, curr){
  const hasResult = curr.legFromId === prev.id && curr.legDistanceKm!=null;
  const isLoading = state.legLoading === curr.id;
  const hasError = state.legErrorId === curr.id;
  return `
    <div class="leg-row">
      <div class="leg-body">
        <div class="faint">🧭 จาก ${esc(prev.name)} → ${esc(curr.name)}</div>
        ${hasResult ? `
          <div style="font-weight:600;font-size:13.5px;margin-top:3px;color:var(--olive);">ระยะทาง ${money(Math.round(curr.legDistanceKm))} กม. · เวลา ${Math.floor(curr.legDurationMin/60)} ชม. ${Math.round(curr.legDurationMin%60)} นาที</div>
          <button class="btn btn-ghost btn-sm" style="margin-top:6px;" onclick="app.calcLegRoute('${t.id}','${prev.id}','${curr.id}')" ${isLoading?'disabled':''}>${isLoading? '⏳ กำลังคำนวณ...' : '🔄 คำนวณใหม่'}</button>
        ` : `
          <button class="btn btn-ghost btn-sm" style="margin-top:5px;" onclick="app.calcLegRoute('${t.id}','${prev.id}','${curr.id}')" ${isLoading?'disabled':''}>${isLoading? '⏳ กำลังคำนวณ...' : '🧭 คำนวณระยะทาง & เวลา'}</button>
        `}
        ${hasError ? `<div class="faint" style="color:var(--terracotta);margin-top:6px;">คำนวณไม่สำเร็จ — ใช้ได้เฉพาะตอนเปิดนอกแชท Claude (เช่นผ่าน GitHub Pages) หรือเช็คอินเทอร์เน็ต</div>`:''}

function renderBudgetSub(t, spent, pct, over){
  const exps = [...(t.expenses||[])].sort((a,b)=>(b.date||'').localeCompare(a.date||''));
  const byCategory = {};
  exps.forEach(e=>{ byCategory[e.category] = (byCategory[e.category]||0) + Number(e.amount||0); });
  const catBudgets = t.categoryBudgets || {};
  const catSum = EXPENSE_CATS.reduce((s,c)=>s+Number(catBudgets[c]||0),0);
  const unallocated = t.budget>0 ? (t.budget - catSum) : null;
  return `
    <div class="card">
      <label>งบประมาณรวมที่ตั้งไว้ (บาท)</label>
      <input type="number" inputmode="numeric" min="0" value="${t.budget??''}" onchange="app.updateBudget('${t.id}',this.value)">
      ${t.budget>0 ? `
        <div class="row" style="margin-top:12px;"><div class="muted">ใช้ไปแล้ว ฿${money(spent)}</div><div class="muted">${pct}%</div></div>
        <div class="bar-track"><div class="bar-fill ${over?'over':''}" style="width:${pct}%;"></div></div>
        ${over? `<div class="faint" style="color:var(--terracotta);margin-top:6px;">เกินงบไปแล้ว ฿${money(spent-t.budget)}</div>` : ''}
      ` : ''}
      ${catSum>0 ? `
        <div class="row" style="margin-top:12px;"><div class="faint">จัดสรรตามหมวดแล้ว ฿${money(catSum)}</div>
          ${unallocated!=null ? `<div class="faint" style="${unallocated<0?'color:var(--terracotta);':''}">${unallocated>=0? 'เหลือยังไม่จัดสรร ฿'+money(unallocated) : 'จัดสรรเกินงบรวม ฿'+money(-unallocated)}</div>` : ''}
        </div>
        ${t.budget !== catSum ? `<button class="btn btn-ghost btn-sm" style="margin-top:8px;" onclick="app.applyCategorySumToBudget('${t.id}')">ใช้ ฿${money(catSum)} เป็นงบรวมแทน</button>` : ''}
      ` : ''}
    </div>

    <div class="card">
      <div style="font-weight:700;margin-bottom:10px;">งบแยกตามหมวดหมู่ <span class="faint">(ใส่หรือไม่ก็ได้ — ไม่จำเป็นต้องรวมเท่างบรวม เผื่อเงินสำรองได้)</span></div>
      ${EXPENSE_CATS.map((c,i)=>{
        const budget = Number(catBudgets[c]||0);
        const spentC = Number(byCategory[c]||0);
        const p = budget>0? Math.min(100, Math.round(spentC/budget*100)) : 0;
        const o = budget>0 && spentC>budget;
        return `
          <div style="padding:${i===0?'0':'12px'} 0 12px;${i>0?'border-top:1px solid var(--border);':''}">
            <div class="row">
              <div style="font-size:13.5px;">${c}</div>
              <input type="number" inputmode="numeric" min="0" style="width:104px;text-align:right;padding:7px 9px;" placeholder="0" value="${catBudgets[c]??''}" onchange="app.updateCategoryBudget('${t.id}','${c}',this.value)">
            </div>
            <div class="row" style="margin-top:6px;">
              <div class="faint">ใช้ไปแล้ว ฿${money(spentC)}</div>
              ${budget>0? `<div class="faint">${p}%</div>` : ''}
            </div>
            ${budget>0? `<div class="bar-track" style="height:6px;"><div class="bar-fill ${o?'over':''}" style="width:${p}%;"></div></div>` : ''}
            ${o? `<div class="faint" style="color:var(--terracotta);margin-top:4px;">เกินงบหมวดนี้ ฿${money(spentC-budget)}</div>`:''}
          </div>
        `;
      }).join('')}
    </div>

    <div class="card">
      ${exps.length===0? `<div class="faint" style="text-align:center;padding:10px;">ยังไม่มีรายการค่าใช้จ่าย</div>` :
        exps.map(e=>`
        <div class="cp-item">
          <div class="row">
            <div><div style="font-weight:600;">${esc(e.category)}</div><div class="faint">${fmtDate(e.date)}${e.note? ' · '+esc(e.note):''}</div></div>
            <div class="row" style="gap:8px;">
              <div style="font-weight:700;">฿${money(e.amount)}</div>
              <button class="back-btn" style="font-size:15px;" onclick="app.deleteExpense('${t.id}','${e.id}')">✕</button>
            </div>
          </div>
        </div>
      `).join('')}
    </div>
    <button class="btn btn-primary btn-full" onclick="app.openSheet('new-expense','${t.id}')">+ เพิ่มค่าใช้จ่าย</button>
  `;
}

/* ---------- Dashboard ---------- */

  const totalTrips = activeTrips().length;
  const totalDist = activeTrips().reduce((s,t)=>{
    const v = t.vehicle;
    if(v && v.startOdo!=null && v.endOdo!=null && v.endOdo>=v.startOdo) return s + (v.endOdo - v.startOdo);

  },0);

  return `
    <div class="topbar" style="padding-left:0;padding-right:0;">
      <div class="eyebrow">สรุปการเดินทาง</div>
      <h1>แผนที่ของฉัน</h1>
    </div>

    <div class="map-wrap">
      <svg viewBox="0 0 ${MAP_VIEW.w} ${MAP_VIEW.h}" xmlns="http://www.w3.org/2000/svg">

/* ---------- Expense Summary ---------- */
function renderExpenseSummary(){
  const trips = activeTrips();
  const totalSpent = trips.reduce((s,t)=> s + (t.expenses||[]).reduce((a,e)=>a+Number(e.amount||0),0), 0);
  const byCategory = {};
  trips.forEach(t=> (t.expenses||[]).forEach(e=>{ byCategory[e.category] = (byCategory[e.category]||0) + Number(e.amount||0); }));
  const categoryEntries = EXPENSE_CATS.map(c=>({cat:c, amt:byCategory[c]||0})).filter(x=>x.amt>0).sort((a,b)=>b.amt-a.amt);
  const tripRows = [...trips].sort((a,b)=>(b.startDate||'').localeCompare(a.startDate||'')).map(t=>({
    id:t.id, name:t.name,
    spent: (t.expenses||[]).reduce((a,e)=>a+Number(e.amount||0),0)
  }));

  return `
    <div class="topbar" style="padding-left:0;padding-right:0;">
      <div class="eyebrow">ภาพรวมการเงิน</div>

/* ---------- Diary ---------- */
function renderDiary(){
  const trips = [...activeTrips()].sort((a,b)=> (b.startDate||'').localeCompare(a.startDate||''));
  return `
    <div class="topbar" style="padding-left:0;padding-right:0;">
      <div class="eyebrow">สมุดบันทึกการเดินทาง</div>
      <h1>พื้นที่ความทรงจำ</h1>
    </div>
    ${trips.length===0 ? `
      <div class="empty-state">
        <div class="big">📔</div>
        <div class="title">ยังไม่มีบันทึก</div>
        <div>ระหว่างทาง...เป็นอย่างไรบ้าง?</div>
      </div>
    ` : trips.map(t=>renderDiaryEntry(t)).join('')}
  `;
}

function renderDiaryEntry(t){
  const cps = t.checkpoints||[];
  const highlightCp = t.diaryHighlightId ? cps.find(c=>c.id===t.diaryHighlightId) : null;
  const moodEditing = !t.diaryMood || state.diaryMoodEditingTripId === t.id;
  const selectedMood = t.diaryMood ? MOODS.find(m=>m.v===t.diaryMood) : null;
  return `
    <div class="card">
      <div class="row">
        <div style="font-weight:700;font-size:16px;">${esc(t.name)}</div>
        <select onchange="app.setStatus('${t.id}', this.value)" style="width:auto;padding:4px 10px;font-size:11px;border-radius:100px;font-family:'Trirong',serif;font-weight:600;">
          ${Object.keys(STATUS_LABEL).map(k=>`<option value="${k}" ${t.status===k?'selected':''}>${STATUS_LABEL[k]}</option>`).join('')}
        </select>
      </div>
      <div class="muted" style="margin-top:2px;margin-bottom:12px;">${fmtDate(t.startDate)} – ${fmtDate(t.endDate)}</div>

      <div class="faint" style="margin-bottom:5px;">ความรู้สึกโดยรวม</div>
      ${moodEditing ? `
        <div class="chip-select" style="margin-bottom:12px;">
          ${MOODS.map(m=>`<div class="chip ${t.diaryMood===m.v?'on':''}" onclick="app.setDiaryMood('${t.id}','${m.v}')">${m.e} ${m.v}</div>`).join('')}
        </div>
      ` : `
        <div class="row" style="margin-bottom:12px;">
          <div class="chip on" style="cursor:default;">${selectedMood?selectedMood.e:''} ${esc(t.diaryMood)}</div>
          <button class="btn btn-ghost btn-sm" onclick="app.editDiaryMood('${t.id}')">แก้ไข</button>
        </div>
      `}

      ${cps.length>0 ? `
        <div class="faint" style="margin-bottom:5px;">โมเมนต์ที่ประทับใจที่สุด</div>
        <select onchange="app.setDiaryHighlight('${t.id}', this.value)" style="margin-bottom:${highlightCp?'8px':'12px'};">
          <option value="">— ไม่ระบุ —</option>
          ${cps.map(c=>`<option value="${c.id}" ${t.diaryHighlightId===c.id?'selected':''}>${esc(c.name)} (${esc(c.province)})</option>`).join('')}
        </select>
        ${highlightCp ? `
          <div class="row card-tap" style="margin-bottom:12px;padding:8px 10px;background:rgba(92,107,69,.06);border:1px dashed var(--border);border-radius:10px;" onclick="app.openTripToStop('${t.id}')">
            <div class="muted">✨ ${esc(highlightCp.name)}</div>
            <div class="faint">ดูจุดนี้ →</div>
          </div>
        ` : ''}
      ` : ''}

      <div class="faint" style="margin-bottom:5px;">บันทึกความทรงจำของทริปนี้</div>
      <textarea placeholder="ทริปนี้ภาพรวมเป็นยังไง ประทับใจอะไร อยากจำอะไรไว้บ้าง..." onchange="app.updateDiaryText('${t.id}', this.value)">${esc(t.diaryText||'')}</textarea>
    </div>
  `;
}

function renderSheet(stats){
  if(!state.sheet) return '';
  const [type, a, b] = state.sheet;
  let inner = '';
  if(type==='new-trip') inner = sheetNewTrip();
  else if(type==='new-cp') inner = sheetCheckpoint(a, null);
  else if(type==='edit-cp') inner = sheetCheckpoint(a, b);
  else if(type==='new-expense') inner = sheetExpense(a, b ? decodeURIComponent(b) : null);
  else if(type==='province') inner = sheetProvince(decodeURIComponent(a), stats);
  else if(type==='trash') inner = sheetTrash();

  return `<div class="overlay" onclick="if(event.target===this) app.closeSheet()">
    <div class="sheet">
      <div class="sheet-handle"></div>
      <button class="sheet-close" onclick="app.closeSheet()">✕</button>
      ${inner}
    </div>
  </div>`;
}

function sheetNewTrip(){
  return `
    <h2 style="margin-top:0;">ทริปใหม่</h2>
    <label>ชื่อทริป</label>
    <input id="f-name" placeholder="เช่น เหนือ 5 วัน 4 คืน">
    <div class="field-row">
      <div><label>วันที่เริ่ม</label><input id="f-start" type="date"></div>
      <div><label>วันที่กลับ</label><input id="f-end" type="date"></div>
    </div>
    <label>งบประมาณ (บาท, ใส่หรือไม่ก็ได้)</label>
    <input id="f-budget" type="number" inputmode="numeric" min="0" placeholder="0">
    <button class="btn btn-primary btn-full" style="margin-top:16px;" onclick="app.createTrip()">สร้างทริป</button>
  `;
}

function sheetCheckpoint(tripId, cpId){
  const t = findTrip(tripId);
  const cp = cpId ? (t.checkpoints||[]).find(c=>c.id===cpId) : null;
  return `
    <h2 style="margin-top:0;">${cp? 'แก้ไขจุดแวะ':'เพิ่มจุดแวะ'}</h2>
    <label>ชื่อสถานที่</label>
    <input id="f-cpname" value="${cp?esc(cp.name):''}" placeholder="เช่น วัดร่องขุ่น">
    <label>จังหวัด</label>
    <select id="f-cpprovince">
      <option value="">เลือกจังหวัด</option>
      ${ALL_PROVINCES.map(p=>`<option value="${p}" ${cp&&cp.province===p?'selected':''}>${p}</option>`).join('')}
    </select>
    <label>วันที่</label>
    <input id="f-cpdate" type="date" value="${cp?cp.date||'':''}">
    ${!cp ? `
      <label>สถานะ</label>
      <div class="chip-select">
        <div class="chip on" id="chip-plan" onclick="app.toggleVisitedChip(false)">วางแผนไว้</div>
        <div class="chip" id="chip-visited" onclick="app.toggleVisitedChip(true)">ไปแล้ว</div>
      </div>
      <label>ความรู้สึก (ถ้าไปแล้ว)</label>
      <div class="chip-select" id="mood-chips">
        ${MOODS.map(m=>`<div class="chip" data-mood="${m.v}" onclick="app.selectMood('${m.v}')">${m.e} ${m.v}</div>`).join('')}
      </div>
      <label>บันทึกความทรงจำ</label>
      <textarea id="f-cpnote" placeholder="ไปแล้วรู้สึกยังไง เจออะไรน่าจดจำบ้าง..."></textarea>
    ` : `
      <div class="faint" style="margin-top:10px;">สถานะ ความรู้สึก และบันทึกความทรงจำ แก้ไขได้โดยตรงในการ์ดจุดแวะเลย ไม่ต้องเปิดหน้านี้</div>
    `}
    <button class="btn btn-primary btn-full" style="margin-top:16px;" onclick="app.saveCheckpoint('${tripId}','${cpId||''}')">บันทึก</button>
  `;
}

function sheetExpense(tripId, placeName){
  return `
    <h2 style="margin-top:0;">เพิ่มค่าใช้จ่าย</h2>
    ${placeName ? `<div class="faint" style="margin-bottom:4px;">📍 ที่ ${esc(placeName)}</div>` : ''}
    <label>หมวดหมู่</label>
    <select id="f-excat">${EXPENSE_CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
    <label>จำนวนเงิน (บาท)</label>
    <input id="f-examt" type="number" inputmode="numeric" min="0" placeholder="0">
    <label>วันที่</label>
    <input id="f-exdate" type="date">
    <label>หมายเหตุ (ถ้ามี)</label>
    <input id="f-exnote" placeholder="เช่น ปั๊ม ปตท. สระบุรี" value="${placeName? esc(placeName):''}">
    <button class="btn btn-primary btn-full" style="margin-top:16px;" onclick="app.saveExpense('${tripId}')">บันทึก</button>
  `;
}

function sheetProvince(p, stats){
  const info = stats[p] || {count:0, visits:[]};
  return `
    <h2 style="margin-top:0;">${p}</h2>
    <div class="muted" style="margin-bottom:14px;">ไปมาแล้ว ${info.count} ครั้ง</div>
    ${info.visits.length===0? `<div class="faint">ยังไม่เคยไปจังหวัดนี้</div>` :
      info.visits.map(v=>`
        <div class="cp-item">
          <div class="row"><div style="font-weight:600;">${esc(v.name)}</div>${v.mood? `<span class="mood-badge">${MOODS.find(m=>m.v===v.mood)?.e||''}</span>`:''}</div>
          <div class="faint">${esc(v.trip)} · ${fmtDate(v.date)}</div>
        </div>
      `).join('')
    }
  `;
}

function sheetTrash(){
  const trashed = state.trips.filter(t=>t.deleted).sort((a,b)=>(b.deletedAt||0)-(a.deletedAt||0));
  return `
    <h2 style="margin-top:0;">ถังขยะ</h2>
    <div class="muted" style="margin-bottom:12px;">ทริปที่ลบจะอยู่ที่นี่ กู้คืนได้จนกว่าจะกดลบถาวร</div>
    ${trashed.length===0? `<div class="faint" style="text-align:center;padding:20px 0;">ไม่มีทริปในถังขยะ</div>` :
      trashed.map(t=>`
        <div class="cp-item">
          <div style="font-weight:600;">${esc(t.name)}</div>
          <div class="faint">${fmtDate(t.startDate)} – ${fmtDate(t.endDate)}</div>
          <div style="margin-top:8px;display:flex;gap:8px;">
            <button class="btn btn-primary btn-sm" onclick="app.restoreTrip('${t.id}')">↩️ กู้คืน</button>
            <button class="btn btn-danger btn-sm" onclick="app.permanentlyDeleteTrip('${t.id}')">ลบถาวร</button>
          </div>
        </div>
      `).join('')
    }
  `;
}

function renderConfirmDialog(){
  if(!state.confirmDialog) return '';
  const { message } = state.confirmDialog;
  return `
    <div class="overlay confirm-overlay" style="align-items:center;" onclick="if(event.target===this) app.cancelConfirm()">
      <div class="confirm-box">
        <div style="font-size:14.5px;line-height:1.6;margin-bottom:18px;">${esc(message)}</div>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-ghost" style="flex:1;" onclick="app.cancelConfirm()">ยกเลิก</button>
          <button class="btn btn-primary" style="flex:1;" onclick="app.confirmYes()">ยืนยัน</button>
        </div>
      </div>
    </div>
  `;
}

function esc(s){ return String(s??'').replace(/[&<>"']/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

/* ---------- actions ---------- */
let pendingMood = null, pendingVisited = null;

const app = {
  goTab(tab){ state.tab = tab; state.activeTripId=null; render(); },
  toggleRegion(name){
    if(state.expandedRegions.includes(name)) state.expandedRegions = state.expandedRegions.filter(r=>r!==name);
    else state.expandedRegions = [...state.expandedRegions, name];
    render();
  },
  openTrip(id){ state.activeTripId = id; state.tripSubtab='stops'; render(); },
  openTripToBudget(id){ state.tab='trips'; state.activeTripId = id; state.tripSubtab='budget'; render(); },
  openTripToStop(id){ state.tab='trips'; state.activeTripId = id; state.tripSubtab='stops'; render(); },
  async setDiaryMood(tripId, mood){
    const t = findTrip(tripId);
    if(t) t.diaryMood = (t.diaryMood===mood ? null : mood);
    state.diaryMoodEditingTripId = null;
    render(); scheduleSave();
  },
  editDiaryMood(tripId){
    state.diaryMoodEditingTripId = tripId;
    render();
  },
  async setDiaryHighlight(tripId, cpId){
    const t = findTrip(tripId);
    if(t) t.diaryHighlightId = cpId || null;
    render(); scheduleSave();
  },
  async updateDiaryText(tripId, val){
    const t = findTrip(tripId);
    if(t) t.diaryText = val;
    render(); scheduleSave();
  },
  closeTrip(){ state.activeTripId = null; render(); },
  setSubtab(s){ state.tripSubtab = s; render(); },
  openSheet(type, a, b){
    pendingMood = null; pendingVisited = null;
    if(type==='edit-cp'){
      const t = findTrip(a); const cp = (t.checkpoints||[]).find(c=>c.id===b);
      if(cp){ pendingVisited = !!cp.visited; pendingMood = cp.mood||null; }
    }
    state.sheet = [type, a, b]; render();
  },
  closeSheet(){ state.sheet = null; render(); },

  async createTrip(){
    const name = document.getElementById('f-name').value.trim();
    if(!name){ flashInfo('กรอกชื่อทริปก่อนนะครับ'); return; }
    const startDate = document.getElementById('f-start').value;
    const endDate = document.getElementById('f-end').value;
    if(startDate && endDate && endDate < startDate){
      flashInfo('วันที่กลับมาก่อนวันที่เริ่มเดินทาง ลองตรวจสอบวันที่อีกครั้งนะครับ (ระบบสร้างทริปให้ตามที่กรอกไว้ก่อน แก้ไขทีหลังได้)');
    }
    const trip = {
      id: uid(), name,
      startDate, endDate,
      budget: Math.max(0, Number(document.getElementById('f-budget').value)||0),
      status: 'planning',
      vehicle: {}, expenses: [], checkpoints: []
    };
    state.trips.push(trip); state.sheet=null; state.activeTripId=trip.id;
    render(); scheduleSave();
  },
  async setStatus(id, val){ const t=findTrip(id); if(t){ t.status=val; render(); scheduleSave(); } },

  toggleVisitedChip(v){ pendingVisited = v; document.getElementById('chip-plan').classList.toggle('on', !v); document.getElementById('chip-visited').classList.toggle('on', v); },
  selectMood(v){ pendingMood = (pendingMood===v)? null : v; document.querySelectorAll('#mood-chips .chip').forEach(el=>el.classList.toggle('on', el.dataset.mood===pendingMood)); },

  async saveCheckpoint(tripId, cpId){
    const t = findTrip(tripId); if(!t) return;
    const name = document.getElementById('f-cpname').value.trim();
    const province = document.getElementById('f-cpprovince').value;
    if(!name || !province){ flashInfo('กรอกชื่อสถานที่และเลือกจังหวัดก่อนนะครับ'); return; }
    const date = document.getElementById('f-cpdate').value;
    if(date && t.startDate && t.endDate && (date < t.startDate || date > t.endDate)){
      flashInfo('วันที่ของจุดแวะนี้อยู่นอกช่วงวันเดินทางของทริป ลองตรวจสอบดูนะครับ (ระบบบันทึกให้ตามที่กรอกไว้ก่อน แก้ไขทีหลังได้)');
    }
    t.checkpoints = t.checkpoints || [];
    if(cpId){
      // editing existing checkpoint: only name/province/date come from this form;
      // visited/mood/note are controlled inline in the stops list, so leave them untouched.
      const cp = t.checkpoints.find(c=>c.id===cpId);
      const locationChanged = cp.name!==name || cp.province!==province;
      Object.assign(cp, { name, province, date });
      if(locationChanged){
        // stale coordinates would misplace this stop, so drop cached geodata
        delete cp.lat; delete cp.lon; delete cp.legFromId; delete cp.legDistanceKm; delete cp.legDurationMin;
        delete t.routeStopIds;
      }
    } else {
      const data = {
        name, province, date,
        visited: pendingVisited===null? false : pendingVisited,
        mood: pendingMood,
        note: document.getElementById('f-cpnote').value.trim()
      };
      t.checkpoints.push({id:uid(), ...data});
    }
    state.sheet = null; render(); scheduleSave();
  },
  deleteCheckpoint(tripId, cpId){
    askConfirm('ลบจุดแวะนี้ไหมครับ? บันทึกความทรงจำและความรู้สึกที่บันทึกไว้ในจุดนี้จะหายไปด้วย กู้คืนไม่ได้', 'deleteCheckpoint', {tripId, cpId});
  },
  async setVisited(tripId, cpId, visited){
    const t = findTrip(tripId); const c = t.checkpoints.find(x=>x.id===cpId);
    if(c) c.visited = visited;
    render(); scheduleSave();
  },
  async setMood(tripId, cpId, mood){
    const t = findTrip(tripId); const c = t.checkpoints.find(x=>x.id===cpId);
    if(c) c.mood = (c.mood===mood ? null : mood);
    render(); scheduleSave();
  },
  async updateCheckpointNote(tripId, cpId, val){
    const t = findTrip(tripId); const c = t.checkpoints.find(x=>x.id===cpId);
    if(c) c.note = val;
    render(); scheduleSave();
  },

  async updateVehicle(tripId, field, val){
    const t = findTrip(tripId); t.vehicle = t.vehicle||{};
    t.vehicle[field] = field==='notes'? val : (val===''? null : Math.max(0, Number(val)||0));
    render(); scheduleSave();
  },
  async calcLegRoute(tripId, fromId, toId){
    const t = findTrip(tripId);
    const cpFrom = (t.checkpoints||[]).find(c=>c.id===fromId);
    const cpTo = (t.checkpoints||[]).find(c=>c.id===toId);
    if(!cpFrom || !cpTo) return;
    state.legLoading = toId; state.legErrorId = null; render();
    try{
      const originGeo = await geocodeCheckpoint(cpFrom);
      const destGeo = await geocodeCheckpoint(cpTo);
      if(!originGeo || !destGeo) throw new Error('geocode-failed');
      const route = await calcOSRMRoute(originGeo, destGeo);
      if(!route) throw new Error('route-failed');
      cpTo.legFromId = fromId;
      cpTo.legDistanceKm = route.distanceKm;
      cpTo.legDurationMin = route.durationMin;
      scheduleSave();
    }catch(e){
      console.error(e);
      state.legErrorId = toId;
    }
    state.legLoading = null; render();
  },
  async calcTripRoute(tripId){
    const t = findTrip(tripId);
    const cps = [...(t.checkpoints||[])].sort((a,b)=>(a.date||'').localeCompare(b.date||''));
    if(cps.length<2){ flashInfo('ต้องมีจุดแวะอย่างน้อย 2 จุดถึงจะวาดเส้นทางได้'); return; }
    state.routeMapLoading = tripId; state.routeMapError = null; render();
    try{
      for(const c of cps){
        const geo = await geocodeCheckpoint(c);
        if(!geo) throw new Error('geocode-failed:'+c.name);
      }
      t.routeStopIds = cps.map(c=>c.id);
      scheduleSave();
    }catch(e){
      console.error(e);
      state.routeMapError = tripId;
    }
    state.routeMapLoading = null; render();
  },
  async updateBudget(tripId, val){
    const t = findTrip(tripId); t.budget = Math.max(0, Number(val)||0);
    render(); scheduleSave();
  },
  async updateCategoryBudget(tripId, category, val){
    const t = findTrip(tripId); t.categoryBudgets = t.categoryBudgets || {};
    t.categoryBudgets[category] = val===''? 0 : Math.max(0, Number(val)||0);
    render(); scheduleSave();
  },
  async applyCategorySumToBudget(tripId){
    const t = findTrip(tripId); const catBudgets = t.categoryBudgets || {};
    t.budget = EXPENSE_CATS.reduce((s,c)=>s+Number(catBudgets[c]||0),0);
    render(); scheduleSave();
  },
  async saveExpense(tripId){
    const t = findTrip(tripId);
    const amount = Number(document.getElementById('f-examt').value)||0;
    if(amount<=0){ flashInfo('กรอกจำนวนเงินก่อนนะครับ'); return; }
    const date = document.getElementById('f-exdate').value;
    if(date && t.startDate && t.endDate && (date < t.startDate || date > t.endDate)){
      flashInfo('วันที่ของค่าใช้จ่ายนี้อยู่นอกช่วงวันเดินทางของทริป ลองตรวจสอบดูนะครับ (ระบบบันทึกให้ตามที่กรอกไว้ก่อน แก้ไขทีหลังได้)');
    }
    t.expenses = t.expenses || [];
    t.expenses.push({
      id: uid(),
      category: document.getElementById('f-excat').value,
      amount,
      date,
      note: document.getElementById('f-exnote').value.trim()
    });
    state.sheet = null; render(); scheduleSave();
  },
  deleteExpense(tripId, expId){
    askConfirm('ลบรายการค่าใช้จ่ายนี้ไหมครับ? กู้คืนไม่ได้', 'deleteExpense', {tripId, expId});
  },

  confirmDeleteTrip(id){
    askConfirm('ย้ายทริปนี้ไปถังขยะไหมครับ? กู้คืนได้ภายหลังจากไอคอน "?" มุมบน > ถังขยะ (ยังไม่ลบถาวรตอนนี้)', 'trashTrip', {id});
  },
  async restoreTrip(id){
    const t = findTrip(id);
    if(t){ delete t.deleted; delete t.deletedAt; }
    render(); scheduleSave();
  },
  permanentlyDeleteTrip(id){
    askConfirm('ลบถาวรจริงๆ เลยไหมครับ? กู้คืนไม่ได้อีกแล้ว รวมถึงจุดแวะ ค่าใช้จ่าย และบันทึกทั้งหมดในทริปนี้', 'permaDelete', {id});
  },
  cancelConfirm(){ state.confirmDialog = null; render(); },
  async confirmYes(){
    const c = state.confirmDialog; state.confirmDialog = null;
    if(!c){ render(); return; }
    if(c.type==='trashTrip'){
      const t = findTrip(c.payload.id);
      if(t){ t.deleted = true; t.deletedAt = Date.now(); }
      state.activeTripId = null;
    } else if(c.type==='permaDelete'){
      state.trips = state.trips.filter(x=>x.id!==c.payload.id);
    } else if(c.type==='importData'){
      state.trips = c.payload.data.trips || [];
      flashInfo('นำเข้าข้อมูลเรียบร้อยแล้วครับ');
    } else if(c.type==='deleteCheckpoint'){
      const t = findTrip(c.payload.tripId);
      if(t) t.checkpoints = t.checkpoints.filter(x=>x.id!==c.payload.cpId);
    } else if(c.type==='deleteExpense'){
      const t = findTrip(c.payload.tripId);
      if(t) t.expenses = t.expenses.filter(x=>x.id!==c.payload.expId);
    }
    render(); scheduleSave();
  },

  exportData(){
    const payload = JSON.stringify({trips: state.trips, exportedAt: new Date().toISOString()}, null, 2);
    const blob = new Blob([payload], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url; a.download = `roadtrip-backup-${stamp}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
  },
  async importData(event){
    const file = event.target.files && event.target.files[0];
    if(!file) return;
    try{
      const text = await file.text();
      const data = JSON.parse(text);
      if(!data || !Array.isArray(data.trips)){
        flashInfo('ไฟล์นี้ไม่ใช่ไฟล์สำรองข้อมูลของแอปนี้ ลองเช็คไฟล์อีกครั้งนะครับ');
        event.target.value = ''; return;
      }
      const currentCount = state.trips.length;
      const incomingCount = data.trips.length;
      askConfirm(`นำเข้าจะแทนที่ข้อมูลปัจจุบันทั้งหมด (ตอนนี้มี ${currentCount} ทริป) ด้วยข้อมูลในไฟล์ (${incomingCount} ทริป) ต้องการดำเนินการต่อไหมครับ? แนะนำให้ Export ข้อมูลปัจจุบันเก็บไว้ก่อน เผื่อเปลี่ยนใจ`, 'importData', {data});
      event.target.value = '';
    }catch(e){
      flashInfo('อ่านไฟล์ไม่สำเร็จ ลองเช็คว่าเป็นไฟล์ JSON ที่ export จากแอปนี้นะครับ');
      event.target.value = '';
    }
  },

  async retrySave(){ await retrySave(); },
};
window.app = app;

(async function init(){
  await loadData();
  render();
})();
</script>
</body>
</html>
